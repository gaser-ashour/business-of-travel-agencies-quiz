[2,"A tour operator packaging another supplier’s hotel, and an agency employing its own translators, illustrate that:",["Agencies cannot sell services","Operators never resell","Roles overlap: many travel companies act as both operators and resellers","Both are wholesalers"],2,"The operator/reseller line is blurred in practice."],

[2,"A brand differentiates a product, service or destination and is a promise of what customers can expect.",1,"This is the lecture’s definition and promise idea."],

];
// normalise to [lecture(0/1), type(m/t), text, options|null, answerIndex, explanation]
const Q=R.map(x=>Array.isArray(x[2])?[x[0]-1,"m",x[1],x[2],x[3],x[4]]:[x[0]-1,"t",x[1],null,x[2]?0:1,x[3]]);
Q.sort((a,b)=>a[0]-b[0]||(a[1]==="m"?0:1)-(b[1]==="m"?0:1));
const N=Q.length,A=Array(N).fill(null),$=s=>document.querySelector(s),LT="ABCD",C=2*Math.PI*26;
$("#fg").setAttribute("stroke-dasharray",C);
let h="";
Q.forEach((q,i)=>{
 if(!i)h+=`<h2>${L[q[0]]}</h2>`;else if(Q[i-1][0]!==q[0])h+=`<div class="sep"><span>The following questions are from ${L[q[0]]}</span></div>`;
 const o=q[3]||["True","False"];
 h+=`<div class="q" id="q${i}"><div class="meta">Question ${i+1} of ${N} · ${q[1]==="m"?"Multiple choice":"True or false"}</div><div class="qt">${q[2]}</div>`+
 o.map((t,j)=>`<button class="op" type="button" data-i="${i}" data-j="${j}">${q[3]?`<b>${LT[j]}.</b>`:""}<span>${t}</span></button>`).join("")+`<div class="fb"></div></div>`;
});
$("#qs").innerHTML=h;
$("#qs").addEventListener("click",e=>{const b=e.target.closest(".op");if(b)pick(+b.dataset.i,+b.dataset.j)});
function pick(i,j){
 if(A[i]!==null)return;A[i]=j;
 const q=Q[i],c=$("#q"+i),o=q[3]||["True","False"],f=c.querySelector(".fb");
 c.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add("ok");else if(k===j)b.classList.add("no")});
 if(j===q[4]){f.className="fb ok";f.textContent="✓ Correct answer"}
 else{f.className="fb no";f.innerHTML=`<strong>✗ Wrong answer.</strong> The correct answer: <strong>${o[q[4]]}</strong><br>${q[5]}`}
 upd();
}
function upd(){
 const ok=A.filter((a,i)=>a===Q[i][4]).length,done=A.filter(a=>a!==null).length;
 $("#sc").textContent=ok+" / "+N;$("#rt").textContent=Math.round(ok/N*100)+"%";
 $("#fg").style.strokeDashoffset=C*(1-ok/N);$("#wn").textContent=N-ok;
 $("#st").textContent=done===N?`Test finished: your score is ${ok} out of ${N}`:`You answered ${done} of ${N}`;
}
$("#wbox").onclick=()=>{
 const l=Q.map((q,i)=>i).filter(i=>A[i]!==Q[i][4]);
 $("#wl").innerHTML=l.length?l.map(i=>`<button class="it" type="button" data-go="${i}"><span class="tag ${A[i]===null?"m":""}">${A[i]===null?"Missed":"Wrong"}</span>Q${i+1}: ${Q[i][2].slice(0,70)}${Q[i][2].length>70?"…":""}</button>`).join(""):"No wrong or missed questions 🎉";
 $("#ov").classList.add("on");
};
const close=()=>$("#ov").classList.remove("on");
$("#cl").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#wl").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;close();
 const c=$("#q"+b.dataset.go);c.scrollIntoView({behavior:"smooth",block:"start"});
 c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");
});
upd();
</script>
